services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies schema.sql, then exits. The app waits for this to finish
  # successfully before it starts. Safe to run repeatedly (uses IF NOT EXISTS).
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lms}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  # Optional: wipes and re-seeds demo data. Not part of `docker compose up` —
  # run it explicitly whenever you want fresh demo content:
  #   docker compose run --rm seed
  # (Depends on `migrate` too, not just `db`, so the schema always exists
  # first — running `seed` on a totally fresh stack works on its own.)
  seed:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lms}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:seed"]
    profiles: ["tools"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lms}
      SESSION_SECRET: ${SESSION_SECRET:-dev-super-secret-change-in-production-please}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  lms_pgdata:
